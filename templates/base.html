<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="{% block description %}IMDBies - Watch movies and TV shows online. Stream unlimited movies and TV series for free. High-quality streaming experience with no ads.{% endblock %}">
    <meta name="keywords" content="{% block keywords %}movies online, free streaming, watch movies, TV shows, IMDb, streaming platform{% endblock %}">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="1 day">
    <meta name="author" content="IMDBies">
    <meta name="theme-color" content="#e50914">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Custom Meta Tags -->
    {% block meta %}{% endblock %}
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.description() }}">
    <meta property="og:image" content="{% block og_image %}{{ url_for('static', filename='img/og-image.jpg', _external=True) }}{% endblock %}">
    <meta property="og:site_name" content="IMDBies">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="{{ request.url }}">
    <meta property="twitter:title" content="{{ self.title() }}">
    <meta property="twitter:description" content="{{ self.description() }}">
    <meta property="twitter:image" content="{% block twitter_image %}{{ self.og_image() }}{% endblock %}">
    <meta name="twitter:creator" content="@IMDBies">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ request.url }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://m.media-amazon.com">
    
    <title>{% block title %}IMDBies - Your Ultimate Movie Streaming Destination{% endblock %} - IMDBies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Cinematic Editorial Theme */
            --primary-color: #E50914; /* Crimson Red */
            --primary-color-hover: #ff1c2a;
            --secondary-color: #0A0A0C; /* Deep Obsidian */
            --surface-color: #111114; /* Slightly lighter obsidian */
            --text-primary: #FFFFFF;
            --text-secondary: #8A8A93; /* Slate */
            --gradient-bg: linear-gradient(180deg, #0A0A0C 0%, #111114 100%);
            --card-bg: transparent;
            --card-border: rgba(255, 255, 255, 0.05);
            --modal-bg: rgba(10, 10, 12, 0.98);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --badge-bg: var(--primary-color);
            --badge-text: #ffffff;
            
            --font-display: 'Oswald', sans-serif;
            --font-body: 'Outfit', sans-serif;
        }
        
        [data-bs-theme="light"] {
            /* Light theme is rarely used in cinematic design, keeping it stark */
            --primary-color: #E50914;
            --primary-color-hover: #D00812;
            --secondary-color: #F5F5F5;
            --surface-color: #FFFFFF;
            --text-primary: #1A1A1E;
            --text-secondary: #6B6B75;
            --gradient-bg: linear-gradient(180deg, #FFFFFF 0%, #F5F5F5 100%);
            --card-bg: transparent;
            --card-border: rgba(0, 0, 0, 0.1);
            --modal-bg: rgba(255, 255, 255, 0.98);
            --input-bg: rgba(0, 0, 0, 0.03);
            --input-border: rgba(0, 0, 0, 0.1);
            --badge-bg: var(--primary-color);
            --badge-text: #ffffff;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--gradient-bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.2px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Glassmorphism Navbar */
        .navbar {
            background: linear-gradient(to bottom, rgba(10, 10, 12, 0.9) 0%, transparent 100%) !important;
            backdrop-filter: blur(12px);
            border-bottom: none;
            padding: 1.5rem 0;
            transition: all 0.4s ease;
        }

        .navbar-brand {
            font-family: var(--font-display);
            color: var(--text-primary) !important;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
        }

        .navbar-brand i {
            color: var(--primary-color);
        }

        .nav-link {
            font-family: var(--font-display);
            color: var(--text-primary) !important;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 1.1rem;
            position: relative;
            padding: 0.5rem 1.5rem;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .nav-link:hover {
            opacity: 1;
            color: var(--text-primary) !important;
        }

        /* Standardize Buttons */
        .btn {
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            border-radius: 0;
            padding: 0.8rem 2rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            border: 1px solid var(--primary-color);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-color-hover);
            border-color: var(--primary-color-hover);
            transform: scale(1.02);
        }

        .btn-outline-primary {
            border: 1px solid var(--text-primary);
            color: var(--text-primary);
            background: transparent;
        }

        .btn-outline-primary:hover {
            background: var(--text-primary);
            color: var(--secondary-color);
        }

        .btn-outline-light {
            border: 1px solid var(--input-border);
            color: var(--text-primary);
            background: transparent;
        }

        .btn-outline-light:hover {
            background: var(--input-bg);
            border-color: var(--text-primary);
        }

        /* Search Box Redesign */
        .search-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 0;
        }

        .search-box {
            background: transparent;
            border-radius: 8px;
            padding: 0;
            border: 2px solid var(--input-border);
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
        }

        .search-box:focus-within {
            border-color: var(--text-primary);
        }

        .search-input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 1rem 1.5rem;
            font-size: 1.5rem;
            font-family: var(--font-display);
            font-weight: 300;
            letter-spacing: 1px;
            width: 100%;
        }

        .search-input:focus {
            outline: none;
            box-shadow: none;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
            font-weight: 300;
        }

        .search-actions .btn {
            padding: 1rem;
            border: none;
            background: transparent;
        }
        
        .search-actions .btn-primary {
            color: var(--primary-color);
        }
        .search-actions .btn-primary:hover {
            background: transparent;
            color: var(--primary-color-hover);
            transform: none;
        }

        /* Theme/Watchlist Icons */
        .theme-toggle, .watchlist-toggle {
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0;
            background: transparent;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: 1px solid var(--input-border);
        }

        .theme-toggle:hover, .watchlist-toggle:hover {
            background: var(--input-bg);
            border-color: var(--text-primary);
        }

        .watchlist-count {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            background: var(--primary-color);
            color: #fff;
            border-radius: 50%;
            margin-left: -10px;
            margin-top: -10px;
        }

        footer {
            background: var(--surface-color);
            padding: 4rem 0;
            margin-top: auto;
            border-top: 1px solid var(--card-border);
            font-family: var(--font-display);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: transparent;
            padding: 2rem;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--secondary-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        /* Modals */
        .modal-content {
            background: var(--modal-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
        }
        .modal-header {
            border-bottom: 1px solid var(--card-border);
            padding: 2rem;
        }
        .modal-title {
            font-size: 1.5rem;
            color: var(--primary-color);
        }
        .modal-body {
            padding: 2rem;
        }

        /* Cards override for default usage */
        .card {
            background: var(--card-bg);
            border: none;
            border-radius: 0;
        }
        
        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            border-radius: 0;
            font-family: var(--font-display);
            letter-spacing: 1px;
            font-weight: 400;
            padding: 0.4rem 0.8rem;
        }

        .form-control, .form-select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-primary);
            border-radius: 0;
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control:focus, .form-select:focus {
            background: var(--surface-color);
            border-color: var(--text-primary);
            color: var(--text-primary);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <i class="fas fa-film"></i>IMDBies
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                    </ul>
                    <div class="d-flex align-items-center">
                        <a href="/watchlist" class="btn btn-outline-primary me-2">
                            <i class="fas fa-bookmark me-1"></i>Watchlist
                            <span class="badge bg-primary ms-1" id="watchlistCount">0</span>
                        </a>
                        <button class="btn btn-outline-light" onclick="toggleTheme()" id="themeToggle">
                            <i class="fas fa-moon me-1"></i>Theme
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1" style="margin-top: 76px;">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container text-center">
            <p class="mb-0">Created with <i class="fas fa-heart text-danger"></i> by <a href="https://thesaurabh.tech" target="_blank" rel="noopener noreferrer" class="text-decoration-none">Saurabh</a></p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize and update watchlist count
        function updateWatchlistCount() {
            const watchlistCount = document.getElementById('watchlistCount');
            if (!watchlistCount) return;
            
            try {
                const watchlist = JSON.parse(localStorage.getItem('watchlist') || '[]');
                watchlistCount.textContent = watchlist.length;
                watchlistCount.style.display = watchlist.length > 0 ? 'inline' : 'none';
            } catch (e) {
                console.error('Error updating watchlist count:', e);
                watchlistCount.style.display = 'none';
            }
        }
        
        // Listen for storage changes for cross-tab synchronization
        window.addEventListener('storage', function(e) {
            if (e.key === 'watchlist') {
                updateWatchlistCount();
            }
        });
        
        // Toggle theme function
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.innerHTML = newTheme === 'dark' 
                    ? '<i class="fas fa-moon me-1"></i>Theme'
                    : '<i class="fas fa-sun me-1"></i>Theme';
            }
            
            localStorage.setItem('theme', newTheme);
        }
        
        // Initialize theme from localStorage
        document.addEventListener('DOMContentLoaded', function() {
            // Set theme from localStorage
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-bs-theme', savedTheme);
                
                const themeToggle = document.getElementById('themeToggle');
                if (themeToggle) {
                    themeToggle.innerHTML = savedTheme === 'dark' 
                        ? '<i class="fas fa-moon me-1"></i>Theme'
                        : '<i class="fas fa-sun me-1"></i>Theme';
                }
            }
            
            // Update watchlist count
            updateWatchlistCount();
            
            // Check if we are on a movie page to update the sitemap
            const urlParts = window.location.pathname.split('/');
            if (urlParts.length > 2 && urlParts[1] === 'movie') {
                // This is a movie page, get the IMDb ID
                const imdbId = urlParts[2];
                // Store viewed movies in local storage to avoid excessive updates
                const viewedMovies = JSON.parse(localStorage.getItem('viewedMovies') || '[]');
                if (!viewedMovies.includes(imdbId)) {
                    // Add to viewed movies
                    viewedMovies.push(imdbId);
                    // Keep last 100 movies
                    if (viewedMovies.length > 100) {
                        viewedMovies.shift();
                    }
                    localStorage.setItem('viewedMovies', JSON.stringify(viewedMovies));
                }
            }
        });
    </script>
</body>
</html>
